services:
  postgres:
    image: postgres:17-alpine
    container_name: auto-escola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoescola
      POSTGRES_USER: autoescola
      POSTGRES_PASSWORD: autoescola123
    ports:
      - "5432:5432"
    volumes:
      - autoescola_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoescola -d autoescola"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoescola_dados:
