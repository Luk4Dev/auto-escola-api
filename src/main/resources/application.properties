spring.application.name=auto-escola-api

# PostgreSQL. Os valores podem ser sobrescritos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autoescola}
spring.datasource.username=${DB_USERNAME:autoescola}
spring.datasource.password=${DB_PASSWORD:autoescola123}
spring.datasource.driver-class-name=org.postgresql.Driver

# O Flyway controla a estrutura do banco; o Hibernate apenas confere o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
server.error.include-message=always
